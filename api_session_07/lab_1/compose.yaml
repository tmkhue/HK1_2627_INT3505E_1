services:
  product-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-api:local
    ports:
      - "5000:5000"
    environment:
      APP_CONFIG: production
      SECRET_KEY: ${SECRET_KEY:-local-compose-key-change-before-public-deployment}
      DATABASE_URL: sqlite:////app/instance/products.db
    volumes:
      - product-data:/app/instance
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  product-data:
